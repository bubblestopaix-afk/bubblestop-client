# === Déploiement Netlify de l'app client (version web) ===
# La cible finale reste les stores (builds EAS iOS/Android) — cette version web
# sert de vitrine/test accessible en ligne, comme l'app stock.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

# SPA expo-router : toutes les routes renvoient vers l'app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
